<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="imagens/favicon.ico" type="image/x-icon">
    <title>Document</title>
</head>

<body>
    <h1>Imagens Dinâmica</h1>
    <p>Imagens Dinâmica</p>
    <picture>
        <source media="(min-width: 1050px )" srcset="imagens/imagemG.png" type="image/png">
        <source media="(min-width:750px )" srcset="imagens/imagemM.png" type="image/png">
        <img src="imagens/imagemP.png" alt="FOTO PEQUENA">
    </picture>
    <h1>Reprodozindo áudios</h1>
    <p>Reprodozindo áudios</p>
    <audio preload="metadata" autoplay controls>
        <source src="midia/BONOROJOGANDOROBLOXKKKKKKKKKKKKKKKK.mp3" type="audio/mpeg">
    </audio>
    <video width="500" controls poster="midia/messi.png">
        <source src="midia/BONOROJOGANDOROBLOXKKKKKKKKKKKKKKKK.mp4" type="video/mp4">
    </video>
    
</body>


</html>
